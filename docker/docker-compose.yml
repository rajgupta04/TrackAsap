version: '3.8'

services:
  # Self-Hosted LiveKit WebRTC SFU Server
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: trackasap-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"       # WebRTC HTTP/WebSocket Signaling
      - "7881:7881"       # WebRTC TCP
      - "7882:7882/udp"   # WebRTC UDP Media

  # TrackAsap Python Realtime AI Interviewer Worker
  ai-agent:
    build:
      context: ../ai-agent
      dockerfile: Dockerfile
    container_name: trackasap-ai-agent
    restart: unless-stopped
    depends_on:
      - livekit-server
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TRACKASAP_API_URL=http://host.docker.internal:5000/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
