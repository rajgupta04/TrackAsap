define host {
    use                     linux-server
    host_name               trackasap-backend
    alias                   TrackAsap Express API
    address                 trackasap-backend
    check_command           check_tcp_port!8080
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    contact_groups          admins
}

define host {
    use                     linux-server
    host_name               trackasap-frontend
    alias                   TrackAsap Nginx Frontend
    address                 trackasap-frontend
    check_command           check_tcp_port!8080
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    contact_groups          admins
}

define host {
    use                     linux-server
