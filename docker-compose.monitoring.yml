services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: trackasap-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - trackasap-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: trackasap-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-trackasap_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - trackasap-net

  nagios:
    image: jasonrivers/nagios:latest
    container_name: trackasap-nagios
    restart: unless-stopped
    environment:
      - NAGIOSADMIN_USER=${NAGIOSADMIN_USER:-nagiosadmin}
      - NAGIOSADMIN_PASS=${NAGIOSADMIN_PASS:-trackasap_nagios}
    volumes:
      - ./devops/nagios/objects:/opt/nagios/etc/conf.d/trackasap:ro
      - ./devops/nagios/plugins:/opt/nagios/libexec/custom:ro
    ports:
      - "8085:80"
    networks:
      - trackasap-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: trackasap-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://trackasap-redis:6379
    ports:
      - "9121:9121"
    networks:
      - trackasap-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: trackasap-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - trackasap-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  trackasap-net:
    name: trackasap-net
    driver: bridge
