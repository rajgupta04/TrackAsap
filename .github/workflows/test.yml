name: TrackAsap CI & Automated Test Suite

on:
  push:
    branches: [ main, devops, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: 🧪 Backend API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run Backend API Test Suite
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci_automation_98765

  frontend-tests:
    name: ⚛️ Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

  devops-verify:
    name: 🛠️ DevOps Configs & Docker Compose Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Docker Compose, Ansible, Puppet, Nagios, Prometheus & Grafana
        run: python devops/scripts/verify_devops.py
