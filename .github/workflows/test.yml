name: TrackAsap CI & Automated Test Suite

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: 🧪 Backend API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run Backend API Test Suite
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci_automation_98765

  frontend-tests:
    name: ⚛️ Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build
